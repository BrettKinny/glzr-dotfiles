<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1123 794" role="img" aria-labelledby="title desc">
  <title id="title">Keyboard shortcuts for Omarchy and Windows</title>
  <desc id="desc">A one-page cross-platform keyboard shortcut reference. Mod means Super on Omarchy and Alt on Windows.</desc>
  <style>
    .page { fill: #ffffff; }
    .panel { fill: #f7f8fa; stroke: #cfd5dd; stroke-width: 1.5; }
    .accent { fill: #1769aa; }
    .accent-soft { fill: #e7f1fa; }
    .ink { fill: #18202a; }
    .muted { fill: #56616f; }
    .rule { stroke: #d9dee5; stroke-width: 1; }
    .title { font: 700 32px "DejaVu Sans", sans-serif; letter-spacing: -0.5px; }
    .subtitle { font: 400 14px "DejaVu Sans", sans-serif; }
    .section { font: 700 17px "DejaVu Sans", sans-serif; }
    .label { font: 500 13.5px "DejaVu Sans", sans-serif; }
    .small { font: 400 11.5px "DejaVu Sans", sans-serif; }
    .key { font: 700 12.5px "DejaVu Sans Mono", monospace; }
    .pill { font: 700 12px "DejaVu Sans Mono", monospace; }
    .footer { font: 400 10.5px "DejaVu Sans", sans-serif; }
  </style>

  <rect class="page" width="1123" height="794"/>
  <rect class="accent" x="0" y="0" width="1123" height="8"/>

  <text class="title ink" x="42" y="54">Keyboard Shortcuts</text>
  <text class="subtitle muted" x="43" y="78">One muscle-memory map · Omarchy + Windows</text>

  <rect class="accent-soft" x="698" y="28" width="177" height="38" rx="9"/>
  <text class="small muted" x="713" y="44">OMARCHY MOD</text>
  <text class="pill accent" x="713" y="60">SUPER</text>
  <rect class="accent-soft" x="891" y="28" width="190" height="38" rx="9"/>
  <text class="small muted" x="906" y="44">WINDOWS MOD</text>
  <text class="pill accent" x="906" y="60">ALT</text>

  <!-- Column 1 -->
  <rect class="panel" x="42" y="103" width="329" height="626" rx="12"/>
  <text class="section accent" x="62" y="134">WINDOWS + WORKSPACES</text>
  <line class="rule" x1="62" y1="145" x2="351" y2="145"/>

  <text class="label ink" x="62" y="174">Close window</text><text class="key ink" x="351" y="174" text-anchor="end">Mod+W</text>
  <text class="label ink" x="62" y="207">Fullscreen</text><text class="key ink" x="351" y="207" text-anchor="end">Mod+F</text>
  <text class="label ink" x="62" y="240">Split direction</text><text class="key ink" x="351" y="240" text-anchor="end">Mod+J</text>
  <text class="label ink" x="62" y="273">Float / tile</text><text class="key ink" x="351" y="273" text-anchor="end">Mod+Shift+V</text>
  <text class="label ink" x="62" y="306">Focus window</text><text class="key ink" x="351" y="306" text-anchor="end">Mod+Arrow</text>
  <text class="label ink" x="62" y="339">Move window</text><text class="key ink" x="351" y="339" text-anchor="end">Mod+Shift+Arrow</text>

  <line class="rule" x1="62" y1="356" x2="351" y2="356"/>
  <text class="label ink" x="62" y="386">Workspace 1–10</text><text class="key ink" x="351" y="386" text-anchor="end">Mod+1..0</text>
  <text class="label ink" x="62" y="419">Move + follow</text><text class="key ink" x="351" y="419" text-anchor="end">Mod+Shift+1..0</text>
  <text class="label ink" x="62" y="452">Next / previous</text><text class="key ink" x="351" y="452" text-anchor="end">Mod+Tab / +Shift</text>
  <text class="label ink" x="62" y="485">Former workspace</text><text class="key ink" x="351" y="485" text-anchor="end">Mod+Ctrl+Tab</text>

  <line class="rule" x1="62" y1="502" x2="351" y2="502"/>
  <text class="section ink" x="62" y="532">RESIZE</text>
  <text class="small muted" x="62" y="557">Width · Omarchy</text>
  <text class="key ink" x="351" y="557" text-anchor="end">Mod+- grow · Mod+= shrink</text>
  <text class="small muted" x="62" y="583">Width · Windows</text>
  <text class="key ink" x="351" y="583" text-anchor="end">Mod+= grow · Mod+- shrink</text>
  <text class="small muted" x="62" y="609">Height · both</text>
  <text class="key ink" x="351" y="609" text-anchor="end">Mod+Shift+= / Mod+Shift+-</text>
  <text class="small muted" x="62" y="633">Grow first, shrink second.</text>

  <rect class="accent-soft" x="62" y="662" width="289" height="45" rx="8"/>
  <text class="small muted" x="77" y="681">Pattern</text>
  <text class="small ink" x="77" y="698">Shift moves · Ctrl raises scope</text>

  <!-- Column 2 -->
  <rect class="panel" x="397" y="103" width="329" height="626" rx="12"/>
  <text class="section accent" x="417" y="134">LAUNCHERS</text>
  <line class="rule" x1="417" y1="145" x2="706" y2="145"/>

  <text class="label ink" x="417" y="174">Terminal</text><text class="key ink" x="706" y="174" text-anchor="end">Mod+Enter</text>
  <text class="small muted" x="417" y="192">Default terminal / Windows Terminal</text>

  <text class="label ink" x="417" y="226">Browser</text><text class="key ink" x="706" y="226" text-anchor="end">Mod+Shift+B</text>
  <text class="small muted" x="417" y="244">Default browser / Zen</text>

  <text class="label ink" x="417" y="278">Editor</text><text class="key ink" x="706" y="278" text-anchor="end">Mod+Shift+N</text>
  <text class="small muted" x="417" y="296">Microsoft Edit / Fresh</text>

  <text class="label ink" x="417" y="330">Files</text><text class="key ink" x="706" y="330" text-anchor="end">Mod+Shift+F</text>
  <text class="small muted" x="417" y="348">Elio on both</text>

  <text class="label ink" x="417" y="382">Notes</text><text class="key ink" x="706" y="382" text-anchor="end">Mod+Shift+O</text>
  <text class="small muted" x="417" y="400">Obsidian on both</text>

  <text class="label ink" x="417" y="434">Email</text><text class="key ink" x="706" y="434" text-anchor="end">Mod+Shift+E</text>
  <text class="small muted" x="417" y="452">Web app / Outlook</text>

  <text class="label ink" x="417" y="486">Calendar</text><text class="key ink" x="706" y="486" text-anchor="end">Mod+Shift+C</text>
  <text class="small muted" x="417" y="504">gcal-tui / Outlook Calendar</text>

  <text class="label ink" x="417" y="538">Messaging</text><text class="key ink" x="706" y="538" text-anchor="end">Mod+Shift+G</text>
  <text class="small muted" x="417" y="556">Signal / Teams</text>

  <text class="label ink" x="417" y="590">AI</text><text class="key ink" x="706" y="590" text-anchor="end">Mod+Shift+A</text>
  <text class="small muted" x="417" y="608">Gemini on both</text>

  <rect class="accent-soft" x="417" y="630" width="289" height="77" rx="8"/>
  <text class="section ink" x="432" y="653">CLIPBOARD</text>
  <text class="small muted" x="432" y="674">Copy / paste / cut</text>
  <text class="key ink" x="691" y="674" text-anchor="end">Mod+C / Mod+V / Mod+X</text>
  <text class="small muted" x="432" y="697">History</text>
  <text class="key ink" x="691" y="697" text-anchor="end">Mod+Ctrl+V</text>

  <!-- Column 3 -->
  <rect class="panel" x="752" y="103" width="329" height="626" rx="12"/>
  <text class="section accent" x="772" y="134">HERDR</text>
  <line class="rule" x1="772" y1="145" x2="1061" y2="145"/>

  <text class="label ink" x="772" y="174">New tab</text><text class="key ink" x="1061" y="174" text-anchor="end">Ctrl+T</text>
  <text class="label ink" x="772" y="207">Close pane</text><text class="key ink" x="1061" y="207" text-anchor="end">Ctrl+W</text>
  <text class="label ink" x="772" y="240">Next / previous tab</text><text class="key ink" x="1061" y="240" text-anchor="end">Ctrl+Tab / +Shift</text>
  <text class="label ink" x="772" y="273">Select tab</text><text class="key ink" x="1061" y="273" text-anchor="end">Ctrl+1..9</text>
  <text class="label ink" x="772" y="306">Focus pane</text><text class="key ink" x="1061" y="306" text-anchor="end">Ctrl+Arrow</text>
  <text class="label ink" x="772" y="339">Move pane</text><text class="key ink" x="1061" y="339" text-anchor="end">Ctrl+Shift+Arrow</text>
  <text class="label ink" x="772" y="372">Sidebar / go to</text><text class="key ink" x="1061" y="372" text-anchor="end">Ctrl+B / Ctrl+G</text>
  <text class="label ink" x="772" y="405">Vertical split</text><text class="key ink" x="1061" y="405" text-anchor="end">Ctrl+\</text>
  <text class="label ink" x="772" y="438">Horizontal split</text><text class="key ink" x="1061" y="438" text-anchor="end">Ctrl+Shift+\</text>
  <text class="label ink" x="772" y="471">Zoom pane</text><text class="key ink" x="1061" y="471" text-anchor="end">Ctrl+Shift+Z</text>
  <text class="label ink" x="772" y="504">New workspace</text><text class="key ink" x="1061" y="504" text-anchor="end">Ctrl+Shift+N</text>

  <rect class="accent-soft" x="772" y="532" width="289" height="47" rx="8"/>
  <text class="small muted" x="787" y="551">RECOVERY PREFIX</text>
  <text class="key accent" x="787" y="569">F12</text>

  <text class="section ink" x="772" y="615">SYSTEM-ONLY EXTRAS</text>
  <line class="rule" x1="772" y1="626" x2="1061" y2="626"/>
  <text class="small muted" x="772" y="650">Omarchy · hold to dictate</text>
  <text class="key ink" x="1061" y="650" text-anchor="end">Alt+Space</text>
  <text class="small muted" x="772" y="677">Windows · resize mode</text>
  <text class="key ink" x="1061" y="677" text-anchor="end">Mod+R</text>
  <text class="small muted" x="772" y="704">Windows · reload GlazeWM</text>
  <text class="key ink" x="1061" y="704" text-anchor="end">Mod+Shift+R</text>

  <text class="footer muted" x="42" y="762">MOD is conceptual: use Super on Omarchy, Alt on Windows. Universal clipboard chords work in terminals and GUI apps.</text>
  <text class="footer muted" x="1081" y="762" text-anchor="end">A4 landscape · 100%</text>
</svg>
